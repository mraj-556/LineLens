name: Build and Upload

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Create ZIP
        run: |
          zip -r LineLens.zip dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineLens
          path: LineLens.zip
          retention-days: 30