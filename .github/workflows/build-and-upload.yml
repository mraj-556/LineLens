name: Build and Publish

on:
  workflow_dispatch:
    push:
      branches:
        - main

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
  
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Extension
        run: bun run build

      - name: Create ZIP Package
        run: |
          cd dist
          zip -r ../LineLens.zip .

      - name: Get Access Token
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="${{ secrets.CHROME_CLIENT_ID }}" \
            -d client_secret="${{ secrets.CHROME_CLIENT_SECRET }}" \
            -d refresh_token="${{ secrets.CHROME_REFRESH_TOKEN }}" \
            -d grant_type=refresh_token)

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          echo "::add-mask::$ACCESS_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Upload Extension
        run: |
          curl -v \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -X POST \
            -T LineLens.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${{ secrets.CHROME_PUBLISHER_ID }}/items/${{ secrets.CHROME_EXTENSION_ID }}:upload"

      - name: Publish Extension
        run: |
          curl -v \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/${{ secrets.CHROME_PUBLISHER_ID }}/items/${{ secrets.CHROME_EXTENSION_ID }}:publish"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: LineLens.zip
          overwrite_files: true
          make_latest: true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineLens
          path: LineLens.zip
